<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casos de éxito · Carlos Cristóbal Fisioterapia</title>
<meta name="description" content="Pacientes reales que han recuperado su rodilla con la readaptación de Carlos Cristóbal, fisioterapeuta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --card:#0F1110; --card-2:#1A1D1B; --accent:#C8E6C3; --accent-dark:#5A7A52;
    --text:#1A1A1A; --muted:#6B6B6B; --line:#E8E8E4; --wa:#25D366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"DM Sans",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:0 12px}

  /* Cabecera fija */
  .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);text-align:center;padding:16px 12px}
  .logo{font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase}
  .logo span{color:var(--accent-dark)}

  h1{font-weight:800;font-size:clamp(28px,7.4vw,40px);line-height:1.12;letter-spacing:-.035em;text-align:center;padding:40px 16px 36px}

  /* Tarjeta de caso */
  .case{margin-bottom:34px}
  .card{background:var(--card);border-radius:14px;padding:14px 0 14px 18px;color:#fff;overflow:hidden}
  .card .brand{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8C918D;margin-bottom:12px}
  .row{display:grid;grid-template-columns:38% 1fr;gap:14px;align-items:stretch}
  .left{display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:4px 0}
  .head{font-weight:800;font-size:clamp(13px,3.9vw,18px);line-height:1.12;text-transform:uppercase;letter-spacing:-.01em}
  .head .before{color:var(--accent)}
  .stat{background:var(--card-2);border:1px solid #2C302D;border-radius:10px;padding:10px 12px;width:fit-content;max-width:100%}
  .stat b{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(17px,5vw,24px);color:var(--accent);letter-spacing:-.02em;line-height:1.1}
  .stat b i{font-style:normal;font-size:.7em;color:#4ADE80}
  .stat small{display:block;margin-top:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8C918D}

  .media{position:relative;display:block;width:100%;border:0;padding:0;cursor:pointer;background:#222 center 30%/cover no-repeat;border-radius:8px 0 0 8px;aspect-ratio:4/3.4;align-self:center}
  .play{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
  .play svg{width:22px;height:22px;margin-left:3px;fill:var(--card)}
  .media:active .play{transform:scale(.92)}
  .media.corner .play{left:auto;top:auto;right:12px;bottom:12px;margin:0;width:50px;height:50px}

  .quote{font-size:16px;line-height:1.7;color:#3D3D3D;padding:14px 8px 0}
  .quote strong{color:var(--text);font-weight:700}

  /* Cierre */
  .end{text-align:center;padding:20px 16px 140px}
  .end h2{font-weight:800;font-size:clamp(24px,6.5vw,32px);letter-spacing:-.03em;line-height:1.15;margin-bottom:10px}
  .end p{color:var(--muted);font-size:16px}

  /* Botón WhatsApp fijo */
  .float{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;max-width:616px;margin:0 auto}
  .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:16px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(37,211,102,.35)}
  .btn-wa svg{width:22px;height:22px;flex:none}

  /* Reproductor */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .modal video{max-width:100%;max-height:88vh;border-radius:12px;background:#000}
  .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:44px;cursor:pointer}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.45 9.45 0 0 1-4.82-1.32l-.35-.2-3.58.94.96-3.49-.23-.36a9.43 9.43 0 0 1-1.45-5.03c0-5.22 4.25-9.47 9.48-9.47 2.53 0 4.9.99 6.7 2.78a9.4 9.4 0 0 1 2.77 6.7c0 5.22-4.25 9.47-9.47 9.47zm8.06-17.53A11.33 11.33 0 0 0 12.04.63C5.76.63.65 5.74.65 12.02c0 2 .52 3.96 1.52 5.69L.55 23.6l6.04-1.58a11.38 11.38 0 0 0 5.44 1.39h.01c6.28 0 11.39-5.11 11.39-11.39 0-3.04-1.18-5.9-3.33-8.05z"/></symbol>
</svg>

<header class="top"><div class="logo">Carlos Cristóbal <span>Fisio</span></div></header>

<main class="wrap">
  <h1>Algunos resultados de mis pacientes</h1>
  <div id="cases"></div>
  <section class="end">
    <h2>¿Quieres ser el próximo caso de éxito?</h2>
    <p>Cuéntame tu lesión de rodilla. Te respondo en menos de 24 horas.</p>
  </section>
</main>

<div class="float">
  <a class="btn-wa" id="wa" href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#wa"/></svg>Escríbeme por WhatsApp</a>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Vídeo testimonio">
  <button class="close" id="close" aria-label="Cerrar">×</button>
  <video id="player" controls playsinline></video>
</div>

<script>
  /* ================= EDITA SOLO ESTA PARTE ================= */

  // Tu número con prefijo de país, sin "+" ni espacios. Ej: 34612345678
  const WHATSAPP = "34XXXXXXXXX";
  const MENSAJE  = "Hola Carlos, he visto los casos de éxito y quiero recuperar mi rodilla. Mi lesión es: ";
  const MARCA    = "Carlos Cristóbal Fisio";   // texto pequeño arriba de cada tarjeta

  // Un bloque por paciente. Vídeos y portadas en la carpeta videos/
  //   antes   → frase en verde (cómo estaba)
  //   despues → frase en blanco (cómo está ahora)
  //   dato    → cifra grande del recuadro      tiempo → texto pequeño debajo
  //   boton   → (opcional) "esquina" pone el play abajo a la derecha si tapa la cara
  //   encuadre → (opcional) qué parte de la portada se ve, ej. "center 58%" si la cara sale baja
  const CASOS = [
    { nombre:"Adrián", antes:"14 años con miedo a correr y saltar", despues:"Vuelve a jugar al fútbol al 100%",
      dato:"100%", tiempo:"LCA · menisco · cartílago",
      frase:"Llevaba 14 años con la rodilla inestable y sin fuerza. Ha perdido el miedo, ha vuelto a saltar y ha recuperado la confianza para jugar al fútbol al 100%.",
      video:"videos/adrian.mp4", portada:"videos/adrian.jpg" },
    { nombre:"Manuel", antes:"Lesión de menisco y sin querer operarse", despues:"Juega al fútbol y trabaja sin limitaciones",
      dato:"100%", tiempo:"Menisco · sin cirugía",
      frase:"No quería operarse y necesitaba seguir trabajando. La rodilla le limitaba en el día a día, en el trabajo y en el deporte. Hoy ha vuelto a jugar al fútbol y a trabajar sin problema, al 100%.",
      video:"videos/manuel.mp4", portada:"videos/manuel.jpg", encuadre:"center 40%" },
    { nombre:"Pedro", antes:"3 operaciones en la misma rodilla", despues:"Vuelve a competir en fútbol",
      dato:"+1 año", tiempo:"Sin recaídas · LCA + menisco",
      frase:"Tres veces operado de la misma rodilla. Trabajamos juntos su readaptación y ha vuelto a competir en fútbol. Lleva ya más de un año sin recaídas.",
      video:"videos/pedro.mp4", portada:"videos/pedro.jpg", encuadre:"center 10%" },
    { nombre:"David", antes:"Sin poder agacharse ni subir escaleras", despues:"Vuelve a correr y hacer senderismo",
      dato:"0 dolor", tiempo:"6 meses · Cartílago",
      frase:"Con la lesión de cartílago no podía agacharse ni subir o bajar escaleras, y tuvo que dejar de correr y de hacer senderismo, lo que más le gusta. Después de 6 meses ha vuelto a hacer las dos cosas sin dolor.",
      video:"videos/david.mp4", portada:"videos/david.jpg", encuadre:"center 20%" },
    { nombre:"José", antes:"De la ambulancia con el LCA roto", despues:"A competir a su máximo nivel",
      dato:"9 meses", tiempo:"LCA · Pre y postoperatorio",
      frase:"Se rompió el LCA y no sabía si volvería a jugar al fútbol. Hizo con nosotros el preoperatorio y toda la recuperación. 9 meses después volvió a competir a su máximo nivel.",
      video:"videos/jose.mp4", portada:"videos/jose.jpg", encuadre:"center 15%" },
    { nombre:"Paola", antes:"No podía caminar más de 5 minutos", despues:"Hoy hace su vida totalmente normal",
      dato:"+ fuerte", tiempo:"Condromalacia rotuliana",
      frase:"Probó pinchazos y corrientes sin mejorar. No podía subir escaleras ni cuestas, agacharse, ponerse tacones ni andar más de 5 minutos, y la rodilla se le hinchaba. Con ejercicios adaptados a ella, hoy hace su vida totalmente normal, está más fuerte y le ha cambiado la vida.",
      video:"videos/paola.mp4", portada:"videos/paola.jpg", encuadre:"center 21%" },
    { nombre:"Natalia", antes:"Operada de LCA y menisco con miedo a volver", despues:"De vuelta al crossfit",
      dato:"4 meses", tiempo:"LCA + menisco",
      frase:"Se rompió el LCA y el menisco haciendo crossfit. Tras la operación hizo con nosotros ejercicios que ni pensaba volver a hacer porque le daban muchísimo miedo. A los 4 meses volvió al crossfit, ganó muchísima confianza y hoy sigue entrenando, corriendo y mejorando.",
      video:"videos/natalia.mp4", portada:"videos/natalia.jpg", encuadre:"center 0%", boton:"esquina" },
    { nombre:"Adrián", antes:"Un año después de operarse seguía con miedo", despues:"Juega al fútbol con confianza",
      dato:"Confianza", tiempo:"LCA + menisco",
      frase:"Tras la operación perdió mucha musculatura, fuerza y movilidad, y llegó a pensar que no volvería a jugar al fútbol. Trabajamos sobre ello y hoy ha vuelto a jugar con confianza: «He recuperado esa sensación de tener una rodilla sana».",
      video:"videos/adrian2.mp4", portada:"videos/adrian2.jpg", encuadre:"center 28%", boton:"esquina" },
    { nombre:"Pablo", antes:"Operado de menisco y sin poder andar", despues:"Corre y juega al fútbol con normalidad",
      dato:"6 meses", tiempo:"Sutura meniscal",
      frase:"Tras la operación no quería la recuperación estándar de la mutua: buscaba una readaptación pensada para volver a su deporte. Empezó sin poder ni andar y en 6 meses volvió a correr y a jugar al fútbol con normalidad.",
      video:"videos/pablo.mp4", portada:"videos/pablo.jpg", encuadre:"center 16%", boton:"esquina" },
  ];

  /* ========================================================= */

  document.getElementById("wa").href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(MENSAJE);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const playIcon = '<svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>';

  document.getElementById("cases").innerHTML = CASOS.map((c, i) => `
    <article class="case">
      <div class="card">
        <div class="brand">${esc(MARCA)}</div>
        <div class="row">
          <div class="left">
            <div class="head"><span class="before">${esc(c.antes)}</span><br>${esc(c.despues)}</div>
            <div class="stat"><b>${esc(c.dato)} <i>✓</i></b><small>${esc(c.tiempo)}</small></div>
          </div>
          <button class="media${c.boton === 'esquina' ? ' corner' : ''}" data-i="${i}" aria-label="Ver testimonio de ${esc(c.nombre)}"
            style="background-image:url('${esc(c.portada)}');background-position:${esc(c.encuadre || 'center 30%')}"><span class="play">${playIcon}</span></button>
        </div>
      </div>
      <p class="quote"><strong>${esc(c.nombre)}</strong> ${esc(c.frase)}</p>
    </article>`).join("");

  const modal = document.getElementById("modal"), player = document.getElementById("player");
  document.getElementById("cases").addEventListener("click", e => {
    const b = e.target.closest(".media"); if (!b) return;
    const c = CASOS[b.dataset.i];
    player.src = c.video; player.poster = c.portada || "";
    modal.classList.add("open"); player.play().catch(()=>{});
  });
  const close = () => { player.pause(); player.removeAttribute("src"); player.load(); modal.classList.remove("open"); };
  document.getElementById("close").onclick = close;
  modal.addEventListener("click", e => { if (e.target === modal) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
</script>
</body>
</html>
