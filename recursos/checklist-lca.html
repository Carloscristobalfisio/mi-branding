<title>Checklist de progresión LCA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200..700;1,9..40,300..500&display=swap">
<style>
/* Layout: test tipo quiz, una pregunta por pantalla, botones grandes; resultado con fase, problemas y CTA oscuro */
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --ink: #1A1A1A;
  --muted: #6B6B6B;
  --faint: #C9CBC4;
  --line: #E8E8E4;
  --accent: #C8E6C3;
  --accent-ink: #5A7A52;
  --no: #D9534F;
  --dark: #0A0A0A;
  --wa: #25D366;
  --font: "DM Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F0D; --surface: #171916; --ink: #F1F2EE; --muted: #9C9F97; --faint: #3A3D36;
    --line: #262923; --accent: #2E3F2B; --accent-ink: #B5D6AF; --no: #E57A76; --dark: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F0D; --surface: #171916; --ink: #F1F2EE; --muted: #9C9F97; --faint: #3A3D36;
  --line: #262923; --accent: #2E3F2B; --accent-ink: #B5D6AF; --no: #E57A76; --dark: #000000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }

.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 16px; }
.brand { font-weight: 600; font-size: 15px; }
.brand span { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.handle { font-size: 13px; color: var(--muted); text-decoration: none; }

.screen { padding-block: 28px 56px; display: grid; gap: 22px; }
.badge { justify-self: start; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; }
.big { font-size: clamp(38px, 10vw, 54px); font-weight: 300; line-height: 1.05; letter-spacing: -.03em; }
.big em { font-weight: 400; }
.sub { color: var(--muted); font-size: 18px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 15px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 0 26px; border-radius: 999px; border: 1px solid transparent;
  font-weight: 600; font-size: 17px; text-decoration: none; transition: transform .15s;
}
.btn:hover { transform: translateY(-1px); }
.btn-ink { background: var(--ink); color: var(--bg); }
.btn-wa { background: var(--wa); color: #0A0A0A; }
.btn-light { background: #FFFFFF; color: #0A0A0A; }
.btn-ghost { background: transparent; color: #FFFFFF; border-color: #3A3A3A; }
.full { width: 100%; }

/* Quiz */
.bar { display: grid; gap: 8px; }
.bar-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.back { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 14px; }
.back:hover { color: var(--ink); }
.track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent-ink); border-radius: 3px; transition: width .3s; }
.q { font-size: clamp(27px, 7vw, 34px); font-weight: 500; line-height: 1.15; letter-spacing: -.02em; }
.hint { color: var(--muted); font-size: 16px; margin-top: -8px; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 17px 20px; font-size: 18px; font-weight: 500; min-height: 62px;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--ink); }
.opt[aria-pressed="true"] { border-color: var(--accent-ink); background: var(--accent); color: var(--accent-ink); }

/* Resultado */
.phase-dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.phase-dots div { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); text-align: center; }
.phase-dots i { height: 8px; border-radius: 4px; background: var(--line); }
.phase-dots .done i { background: var(--accent-ink); }
.phase-dots .now i { background: var(--ink); }
.phase-dots .now { color: var(--ink); font-weight: 700; }
.phase-name { font-size: 19px; font-weight: 500; }
.got { display: flex; flex-wrap: wrap; gap: 8px; }
.got span { background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 999px; }
.got span::before { content: "✓ "; }
h3.label { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.probs { display: grid; gap: 12px; }
.prob { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 8px; }
.prob b { font-size: 18px; font-weight: 600; display: block; }
.prob b::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--no); margin-right: 10px; vertical-align: 2px; }
.prob p { color: var(--muted); font-size: 16px; }
.prob p::before { content: "→ "; color: var(--accent-ink); font-weight: 700; }

.cta { background: var(--dark); color: #FFFFFF; border-radius: 22px; padding: 30px 24px; display: grid; gap: 14px; }
.cta h2 { font-size: clamp(28px, 7.5vw, 38px); font-weight: 300; line-height: 1.08; letter-spacing: -.025em; }
.cta h2 em { font-weight: 400; }
.cta p { color: #B4B6AF; font-size: 17px; }
.cta .btns { display: grid; gap: 10px; margin-top: 6px; }
.cta small { color: #B4B6AF; font-size: 14px; text-align: center; }
.cta small b { color: #C8E6C3; font-weight: 600; }
.again { justify-self: center; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; padding: 8px; }
.legal { color: var(--muted); font-size: 13px; text-align: center; }

.fade { animation: in .28s ease-out; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Carlos Cristóbal Fisioterapia<span>Fisioterapeuta · Readaptación Online</span></div>
    <a class="handle" href="https://www.instagram.com/carloscristobalfisio/" target="_blank" rel="noopener">@carloscristobalfisio</a>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
// Número de WhatsApp en formato internacional sin "+" ni espacios. Vacío = se oculta el botón.
const WHATSAPP = "34674613651";

const Q = [
  { id: "time", q: "¿Cuánto hace que te operaste?", o: ["Menos de 6 semanas", "Entre 6 y 12 semanas", "Entre 3 y 5 meses", "Entre 5 y 9 meses", "Más de 9 meses"] },
  { id: "flex", q: "¿Cuánto puedes doblar la rodilla?", h: "Compárala con la otra pierna.", o: ["Menos que una L", "Hasta formar una L (90º)", "Más que una L, pero menos que la otra", "Igual que la otra pierna"] },
  { id: "ext", q: "¿Puedes estirar la rodilla del todo?", h: "Sentado con la pierna recta: ¿la parte de atrás de la rodilla toca el suelo?", o: ["No", "Casi", "Sí, del todo"] },
  { id: "walk", q: "¿Cómo caminas?", o: ["Con muletas", "Sin muletas, pero cojeo", "Normal, sin cojear"] },
  { id: "quad", q: "Con la pierna estirada, aprieta el muslo. ¿Se te sube la rótula?", h: "La rótula es el hueso redondo de delante de la rodilla.", o: ["No", "No lo sé", "Sí"] },
  { id: "bal", q: "¿Aguantas 30 segundos a la pata coja sobre la pierna operada?", o: ["No", "Me cuesta mucho", "Sí, sin problema"] },
  { id: "str", q: "¿Tiene la pierna operada la misma fuerza que la otra?", h: "Piensa en sentadillas a una pierna o bajar escaleras.", o: ["Mucha menos", "Algo menos", "La misma", "No lo sé"] },
  { id: "jump", q: "¿Puedes saltar y caer sobre la pierna operada?", o: ["Todavía no", "Sí, pero con miedo o la rodilla se me va hacia dentro", "Sí, con control"] },
  { id: "run", q: "¿Puedes correr y hacer cambios de dirección?", o: ["Todavía no corro", "Corro, pero los cambios de dirección no", "Sí, las dos cosas sin dolor ni miedo"] },
  { id: "conf", q: "¿Cuánta confianza tienes para volver a tu deporte?", o: ["Ninguna", "Poca", "Bastante", "Total"] },
];
// Valor "u" = no lo sé
const VAL = { quad: [0, "u", 2], str: [0, 1, 2, "u"] };

const PHASES = [
  { name: "Despertar la rodilla", test: { flex: v => v >= 1, ext: v => v === 2, walk: v => v >= 1, quad: v => v === 2, bal: v => v >= 1 } },
  { name: "Caminar bien y ganar fuerza", test: { flex: v => v >= 2, walk: v => v === 2, bal: v => v === 2, str: v => v >= 1 } },
  { name: "Preparar los saltos", test: { str: v => v === 2, jump: v => v >= 1, time: v => v >= 2 } },
  { name: "Correr y cambiar de dirección", test: { flex: v => v === 3, jump: v => v === 2, run: v => v >= 1, time: v => v >= 3 } },
  { name: "Volver a tu deporte", test: { run: v => v === 2, time: v => v >= 4, conf: v => v >= 2 } },
];

const FIX = {
  flex: ["Tu rodilla todavía no dobla lo suficiente", "Movilidad cada día con ejercicios guiados, ganando grados sin forzar ni inflamar."],
  ext:  ["La rodilla no se estira del todo", "Es lo primero que hay que recuperar. Si no, cambia tu forma de caminar y luego cuesta mucho más."],
  walk: ["Todavía no caminas normal", "Reeducar la forma de andar y fortalecer para quitar la cojera."],
  quad: ["Tu cuádriceps no se activa bien", "Es la base de todo lo demás. Ejercicios de activación hasta que el músculo responda."],
  quadU:["No sabes si tu cuádriceps se activa bien", "Hay que comprobarlo: si falla, todo lo que construyas encima va cojo."],
  bal:  ["Te falta equilibrio en la pierna operada", "Ejercicios de equilibrio que van de fácil a difícil: suelo estable, inestable, ojos cerrados…"],
  str:  ["La pierna operada tiene menos fuerza", "Progresión de cargas: saber cuánto peso, cuántas series y cuándo subir cada semana."],
  strU: ["No sabes cuánta fuerza has perdido", "Hay que medirla y compararla con la otra pierna. Sin ese dato, entrenas a ciegas."],
  jump: ["Todavía no controlas los saltos", "Aprender a frenar y caer bien antes de saltar más. Aquí es donde más gente se vuelve a lesionar."],
  run:  ["Aún no corres ni cambias de dirección", "Plan de carrera progresivo y, cuando la fuerza esté lista, cambios de dirección."],
  time: ["Tu rodilla necesita más tiempo", "El ligamento nuevo todavía se está haciendo fuerte. Mientras, se prepara la fuerza para cuando toque."],
  conf: ["Te falta confianza para volver", "Es muy normal. Se gana practicando gestos de tu deporte poco a poco y con seguridad."],
};
const GOT = {
  flex: "Doblas bien la rodilla", ext: "Estiras del todo", walk: "Caminas sin cojear", quad: "Cuádriceps activo",
  bal: "Buen equilibrio", str: "Fuerza igualada", jump: "Saltos con control", run: "Corres y cambias de dirección", conf: "Confianza para volver",
};

let step = -1;          // -1 = inicio, 0..9 = pregunta, 10 = resultado
let ans = {};
const app = document.getElementById("app");
const val = (id, i) => VAL[id] ? VAL[id][i] : i;

function render() {
  if (step < 0) return renderStart();
  if (step >= Q.length) return renderResult();
  const q = Q[step];
  app.innerHTML = `<section class="screen fade">
    <div class="bar">
      <div class="bar-top">
        <button class="back" type="button" id="back">← Atrás</button>
        <span>${step + 1} de ${Q.length}</span>
      </div>
      <div class="track"><i style="width:${(step + 1) / Q.length * 100}%"></i></div>
    </div>
    <h1 class="q">${q.q}</h1>
    ${q.h ? `<p class="hint">${q.h}</p>` : ""}
    <div class="opts">${q.o.map((t, i) => `<button class="opt" type="button" id="opt-${q.id}-${i}" data-i="${i}" aria-pressed="${ans[q.id] === val(q.id, i)}">${t}</button>`).join("")}</div>
  </section>`;
  document.getElementById("back").onclick = () => { step--; render(); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    ans[q.id] = val(q.id, +b.dataset.i);
    b.setAttribute("aria-pressed", "true");
    setTimeout(() => { step++; render(); window.scrollTo(0, 0); }, 180);
  });
}

function renderStart() {
  app.innerHTML = `<section class="screen fade">
    <span class="badge">Operados de ligamento cruzado</span>
    <h1 class="big">¿En qué fase de tu recuperación <em>estás?</em></h1>
    <p class="sub">Responde 10 preguntas rápidas y te digo en qué fase estás, qué te está frenando y qué hay que hacer para avanzar.</p>
    <div class="facts"><span><b>10</b> preguntas</span><span><b>1</b> minuto</span><span>Resultado al momento</span></div>
    <button class="btn btn-ink full" type="button" id="start">Empezar</button>
  </section>`;
  document.getElementById("start").onclick = () => { step = 0; render(); };
}

function evaluate() {
  for (let p = 0; p < PHASES.length; p++) {
    const fails = Object.entries(PHASES[p].test).filter(([id, ok]) => ans[id] === "u" || !ok(ans[id])).map(([id]) => id);
    if (fails.length) return { phase: p, fails };
  }
  return { phase: 5, fails: [] };
}

function renderResult() {
  const { phase, fails } = evaluate();
  const done = phase === 5;
  const got = Object.keys(GOT).filter(id => ans[id] !== "u" && ans[id] >= 2);
  const probs = fails.map(id => FIX[ans[id] === "u" ? id + "U" : id] || FIX[id]);
  const msg = buildMessage(phase, probs);

  app.innerHTML = `<section class="screen fade">
    <div class="phase-dots">${PHASES.map((p, i) => `<div class="${i < phase ? "done" : i === phase ? "now" : ""}"><i></i>Fase ${i + 1}</div>`).join("")}</div>
    ${done
      ? `<h1 class="big">Estás listo para la <em>prueba final.</em></h1>
         <p class="sub">Por lo que cuentas, has superado las 5 fases. Antes de volver a jugar hay que confirmarlo con tests de salto, fuerza y agilidad. Volver sin medirlo es el error más típico.</p>`
      : `<h1 class="big">Estás en la <em>fase ${phase + 1}.</em></h1>
         <p class="phase-name">${PHASES[phase].name}</p>`}
    ${got.length ? `<div class="got">${got.map(id => `<span>${GOT[id]}</span>`).join("")}</div>` : ""}
    ${probs.length ? `<h3 class="label">Lo que te frena para pasar a la fase ${phase + 2 > 5 ? "final" : phase + 2}</h3>
      <div class="probs">${probs.map(([t, s]) => `<div class="prob"><b>${t}</b><p>${s}</p></div>`).join("")}</div>` : ""}
    <div class="cta">
      <h2>Saber qué hacer es fácil. Lo difícil es saber <em>cómo.</em></h2>
      <p>Cuánto peso, cuántas series, cuándo subir y cuándo parar. Eso es lo que marca la diferencia entre avanzar o volver a lesionarte. Te preparo un plan para tu fase y te acompaño semana a semana.</p>
      <div class="btns">
        ${WHATSAPP ? `<a class="btn btn-wa" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Escríbeme por WhatsApp</a>` : ""}
        <a class="btn btn-ghost" href="https://ig.me/m/carloscristobalfisio" target="_blank" rel="noopener">Escríbeme por Instagram</a>
      </div>
      <small><b>Primera valoración gratis</b> · Respuesta en menos de 24 h</small>
    </div>
    <button class="again" type="button" id="again">Repetir el test</button>
    <p class="legal">Este test es orientativo y no sustituye una valoración. Si tienes dolor, la rodilla se hincha o notas que falla, consúltalo antes de avanzar.</p>
  </section>`;
  document.getElementById("again").onclick = () => { ans = {}; step = -1; render(); window.scrollTo(0, 0); };
}

function buildMessage(phase, probs) {
  const lines = ["Hola Carlos, he hecho el test de recuperación de LCA."];
  lines.push(phase === 5 ? "Me sale que he superado las 5 fases y quiero confirmarlo antes de volver." : `Me sale que estoy en la fase ${phase + 1}.`);
  lines.push("Operado hace: " + Q[0].o[ans.time].toLowerCase() + ".");
  if (probs.length) lines.push("Lo que me frena: " + probs.map(p => p[0].toLowerCase()).join("; ") + ".");
  lines.push("¿Me ayudas?");
  return lines.join("\n");
}

render();
</script>
