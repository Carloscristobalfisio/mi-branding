<title>¿Listo para volver a correr?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200..700;1,9..40,300..500&display=swap">
<style>
/* Layout: una columna estrecha, una pregunta por pantalla, botones grandes para el pulgar */
:root {
  --bg: #FAFAF8; --card: #FFFFFF; --ink: #1A1A1A; --muted: #6B6B6B;
  --line: #E8E8E4; --sage: #C8E6C3; --olive: #5A7A52; --cta: #0A0A0A; --cta-ink: #FFFFFF;
  --warn: #B4433F; --num: #D6D6D0;
  --font: "DM Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A0A0A; --card: #141413; --ink: #F2F2EE; --muted: #A3A39C;
  --line: #2A2A27; --sage: #2F3F2C; --olive: #B5D6AF; --cta: #F2F2EE; --cta-ink: #0A0A0A;
  --warn: #E58A86; --num: #34342F; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0A0A0A; --card: #141413; --ink: #F2F2EE; --muted: #A3A39C;
  --line: #2A2A27; --sage: #2F3F2C; --olive: #B5D6AF; --cta: #F2F2EE; --cta-ink: #0A0A0A;
  --warn: #E58A86; --num: #34342F; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 520px; margin: 0 auto; padding-block: 32px 56px; display: flex; flex-direction: column; gap: 28px; }

.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.brand b { color: var(--ink); font-weight: 600; }
.badge { display: inline-block; background: var(--sage); color: var(--olive); font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }

h1 { font-size: clamp(32px, 8vw, 44px); font-weight: 300; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 em { font-weight: 400; }
.lead { color: var(--muted); margin: 10px 0 0; }

.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .25s; }
.progress span.on { background: var(--ink); }

.step { display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; align-items: baseline; gap: 14px; }
.qnum { font-size: 48px; font-weight: 200; color: var(--num); line-height: 1; font-variant-numeric: tabular-nums; }
.qtext { font-size: 22px; font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; }
.qhelp { color: var(--muted); font-size: 14px; margin: -6px 0 0; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line);
  border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--olive); }
.opt:focus-visible { outline: 3px solid var(--olive); outline-offset: 2px; }
.opt.sel { border-color: var(--ink); background: var(--sage); }
.opt strong { font-weight: 600; font-size: 16px; }
.opt small { color: var(--muted); font-size: 14px; }
.opt.sel small { color: var(--ink); }

.nav { display: flex; justify-content: space-between; align-items: center; }
.back { background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer; padding: 8px 0; }
.back:hover { color: var(--ink); }
.back:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }

/* Resultado */
.result { display: flex; flex-direction: column; gap: 24px; }
.big { background: var(--cta); color: var(--cta-ink); border-radius: 20px; padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; }
.big .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; font-weight: 600; }
.big .weeks { font-size: clamp(52px, 16vw, 76px); font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big .weeks span { font-size: .38em; font-weight: 400; letter-spacing: 0; }
.big .date { opacity: .8; }
.note { margin: 0; }
.big .phase { font-size: clamp(30px, 8vw, 40px); font-weight: 300; line-height: 1.1; text-wrap: balance; }
.meter { display: flex; gap: 6px; margin: 10px 0 2px; }
.meter i { flex: 1; height: 8px; border-radius: 4px; background: currentColor; opacity: .2; }
.meter i.ok { opacity: 1; }
.goal { background: var(--sage); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.goal .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--olive); }
.goal b { font-size: 18px; }
.goal p { margin: 0; }
.checks li.ok .n { color: var(--olive); }
.checks li.ko .n { color: var(--warn); }
.checks li.ko b { color: var(--muted); font-weight: 500; }

h2 { font-size: 20px; font-weight: 600; margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.steps li:last-child { border-bottom: 1px solid var(--line); }
.steps .n { font-size: 26px; font-weight: 200; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.1; }
.steps b { display: block; font-weight: 600; }
.steps p { margin: 2px 0 0; color: var(--muted); font-size: 14px; min-width: 0; }
.alert { border: 1.5px solid var(--warn); border-radius: 14px; padding: 14px 16px; font-size: 14px; }
.alert b { color: var(--warn); }
.cta { display: flex; flex-direction: column; gap: 10px; }
.btn { display: block; text-align: center; text-decoration: none; font: inherit; font-weight: 600; border-radius: 999px;
  padding: 15px 20px; cursor: pointer; border: 1.5px solid var(--cta); }
.btn.primary { background: var(--cta); color: var(--cta-ink); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:focus-visible { outline: 3px solid var(--olive); outline-offset: 2px; }
.sym { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sym label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0; }
.sym input { font: inherit; font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; width: 100%;
  padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.sym input:focus-visible { outline: 3px solid var(--olive); outline-offset: 1px; }
.sym.one { grid-template-columns: 1fr; max-width: 240px; }
.sym label small { font-weight: 400; color: var(--muted); }
.symout { margin: 0; color: var(--muted); font-size: 15px; }
.symout.pass { color: var(--olive); font-weight: 600; }
.symout.fail { color: var(--warn); font-weight: 600; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.fine { font-size: 12px; color: var(--muted); margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  .step, .result { animation: in .3s ease-out; }
  @keyframes in { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <div class="brand"><span><b>Carlos Cristóbal</b> · Fisioterapia</span><span class="badge">Rodilla</span></div>

  <header>
    <h1>¿Puedo volver a <em>correr?</em></h1>
    <p class="lead">Para lesiones de rodilla: LCA, menisco y cartílago. Vuelves a correr cuando tu rodilla cumple los criterios.</p>
  </header>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="app" aria-live="polite"></main>
</div>

<script>
// Cada tipo indica las semanas mínimas tras la operación (0 = sin mínimo)
// y si la vuelta a correr pasa por descarga progresiva (hidroterapia y Alter-G)
const INJURIES = {
  lca: { name: "LCA", hint: "Ligamento cruzado anterior operado",
    types: [{ t: "Plastia de LCA", weeks: 12, unload: true }],
    note: "Volver a correr no es volver a jugar. Los cambios de dirección y el partido tienen sus propios criterios, que vienen después." },
  menisco: { name: "Menisco", hint: "Recortado, cosido o sin operar", q: "¿Qué te hicieron en el menisco?",
    types: [
      { t: "Me quitaron un trozo", s: "Meniscectomía", weeks: 0, unload: false },
      { t: "Me lo cosieron", s: "Sutura de menisco", weeks: 12, unload: true },
      { t: "No me operaron", s: "Tratamiento sin cirugía", weeks: 0, unload: false }],
    note: "En el menisco, la clave es que la rodilla no reaccione: si después de correr se hincha o duele más a la mañana siguiente, toca bajar la carga." },
  cartilago: { name: "Cartílago", hint: "Condropatía, microfracturas o injerto", q: "¿Qué te hicieron en el cartílago?",
    types: [
      { t: "No me operaron", s: "Condropatía o lesión condral", weeks: 0, unload: false },
      { t: "Me hicieron microfracturas", s: "Estimulación de médula ósea", weeks: 16, unload: true },
      { t: "Me pusieron un injerto de cartílago", s: "Mosaicoplastia, implante de condrocitos…", weeks: 24, unload: true }],
    note: "El cartílago se adapta despacio a la carga. Al empezar a correr, mejor terreno blando y días de descanso entre salidas." }
};
const typeOf = a => a.injury === "lca" ? INJURIES.lca.types[0] : INJURIES[a.injury]?.types[a.type];

// Criterios para volver a correr: hay que cumplirlos todos
const CRITERIA = [
  { id: "derrame", label: "Sin derrame o solo trazas",
    q: "¿Tu rodilla está sin hinchar?",
    help: "Sin derrame o solo trazas en el stroke test. Compárala con la otra.",
    options: [{ v: true, t: "Sí, sin derrame o solo trazas" }, { v: false, t: "No, todavía hay derrame" }],
    work: "La rodilla tiene que estar tranquila antes de correr. Si se hincha después de entrenar, hay que ajustar la carga." },
  { id: "movilidad", label: "Extensión completa y flexión de 135°",
    q: "¿Estiras la rodilla del todo y la doblas hasta 135°?",
    help: "Estirada: igual que la otra. Doblada a 135°: el talón casi toca el culo. Si tu fisio te lo ha medido, usa ese dato.",
    options: [{ v: true, t: "Sí, las dos cosas" }, { v: false, t: "No, me falta una o las dos" }],
    work: "Recupera la extensión completa y la flexión hasta 135°. Trabájalas a diario." },
  { id: "dolor", label: "Dolor 0/10 en los ejercicios de carrera y sin cambios a la mañana siguiente",
    q: "¿Haces los ejercicios de carrera sin nada de dolor?",
    help: "Dolor 0 sobre 10 mientras los haces, y a la mañana siguiente la rodilla no duele más ni está más hinchada.",
    options: [{ v: true, t: "Sí, 0 de dolor y al día siguiente igual" }, { v: false, t: "No, me duele o al día siguiente está peor" }],
    work: "Ajusta la carga de los ejercicios de carrera hasta que no duelan nada y la rodilla amanezca igual." },
  { id: "hidro", unloadOnly: true, label: "Programa de carrera en hidroterapia completado (10 km/h × 15 min al 30% del peso corporal)",
    q: "¿Has completado el programa de carrera en piscina?",
    help: "Correr en el agua a 10 km/h durante 15 minutos con el 30% de tu peso corporal.",
    options: [{ v: true, t: "Sí, completado" }, { v: false, t: "No, todavía no" }],
    work: "Completa el programa de hidroterapia hasta correr a 10 km/h durante 15 minutos al 30% de tu peso." },
  { id: "alterg", unloadOnly: true, label: "Programa de carrera en Alter-G completado (del 50 al 90% del peso corporal, 10 km/h × 15 min)",
    q: "¿Has completado el programa en cinta Alter-G?",
    help: "Después de la piscina: cinta antigravedad pasando del 50 al 90% de tu peso, a 10 km/h durante 15 minutos.",
    options: [{ v: true, t: "Sí, completado" }, { v: false, t: "No, todavía no" }],
    work: "Después de la piscina, completa el programa en Alter-G subiendo del 50 al 90% de tu peso a 10 km/h durante 15 minutos." },
  { id: "caminata", label: "Marcha normal y caminata rápida de 30 min sin síntomas", noUnload: true,
    q: "¿Andas 30 minutos rápido sin cojear ni dolor?",
    help: "Andando normal, sin cojear, y que la rodilla no se hinche ni duela más después ni al día siguiente.",
    options: [{ v: true, t: "Sí, sin problemas" }, { v: false, t: "No todavía" }],
    work: "Sube poco a poco: 10, 15, 20 minutos… Si al día siguiente la rodilla está bien, añades 5 minutos más." },
  { id: "pogo", label: "30 pogos a una pierna con buena técnica (talón sin tocar el suelo, rodilla extendida)",
    q: "¿Haces 30 pogos seguidos a una pierna con buena técnica?",
    help: "Saltitos rápidos con la pierna lesionada botando sobre la punta: el talón no toca el suelo y la rodilla va extendida.",
    options: [{ v: true, t: "Sí, 30 con buena técnica" }, { v: false, t: "No, menos o se me va la técnica" }],
    work: "Trabaja los pogos: primero a dos piernas, luego a una. Talón arriba, rodilla extendida, y sube hasta 30 seguidos." },
  { id: "pelvis", label: "Pelvis neutra en el plano frontal en el apoyo medio",
    q: "Al correr, ¿tu cadera se mantiene recta cuando apoyas la pierna lesionada?",
    help: "Que no se te caiga la cadera del otro lado. Lo mejor es que te graben de frente en vídeo.",
    options: [{ v: true, t: "Sí, se mantiene recta" }, { v: false, t: "No, se me cae hacia un lado" }, { v: false, t: "No lo sé", s: "Grábate de frente o que te lo mire tu fisio" }],
    work: "Fuerza de glúteo medio y control de la pelvis al apoyar a una pierna. Grábate de frente para comprobarlo." },
  { id: "lsi", label: "Fuerza de cuádriceps LSI >70%", kind: "sym", min: 70, unit: "kg o N",
    q: "Fuerza de cuádriceps medida con dinamómetro",
    help: "Escribe la fuerza de cada pierna. Calculamos el índice de simetría (LSI).",
    work: "Fuerza de cuádriceps hasta que la pierna lesionada supere el 70% de la sana." },
  { id: "ikdc", label: "IKDC >64%", kind: "score", min: 64,
    q: "¿Qué puntuación tienes en el cuestionario IKDC?",
    help: "Es el cuestionario sobre cómo notas tu rodilla. La puntuación va de 0 a 100.",
    work: "Rellena el cuestionario IKDC: tiene que salirte por encima de 64." }
];

function criteriaFor(a) {
  const unload = typeOf(a)?.unload;
  return CRITERIA.filter(c => unload ? !c.noUnload : !c.unloadOnly);
}

function questions(a) {
  const list = [{ id: "injury", text: "¿Qué te pasó en la rodilla?",
    options: Object.entries(INJURIES).map(([v, i]) => ({ v, t: i.name, s: i.hint })) }];
  if (!a.injury) return list;
  if (a.injury !== "lca") list.push({ id: "type", text: INJURIES[a.injury].q,
    options: INJURIES[a.injury].types.map((x, i) => ({ v: i, t: x.t, s: x.s })) });
  const t = typeOf(a);
  if (t?.weeks) list.push({ id: "weeks", text: `¿Han pasado ${t.weeks} semanas o más desde la operación?`,
    options: [{ v: true, t: "Sí" }, { v: false, t: "No, todavía no" }] });
  return list.concat(criteriaFor(a).map(c => ({ ...c, text: c.q })));
}

let step = 0;
const answers = {};
const app = document.getElementById("app");
const progress = document.getElementById("progress");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");

function paintProgress(total) {
  progress.innerHTML = Array.from({ length: total }, (_, i) => `<span class="${i < step || step >= total ? "on" : ""}"></span>`).join("");
}

function head(q) {
  return `<div class="qhead"><span class="qnum">${pad(step + 1)}</span><h2 class="qtext">${esc(q.text)}</h2></div>
    ${q.help ? `<p class="qhelp">${esc(q.help)}</p>` : ""}`;
}
function nav(total) {
  return `<div class="nav">${step > 0 ? `<button class="back" id="back">← Atrás</button>` : "<span></span>"}
    <span class="fine">${step + 1} de ${total}</span></div>`;
}
function next() { step++; render(); }
function bindBack() {
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { step--; render(); });
}

function renderChoice(q, total) {
  app.innerHTML = `<section class="step">${head(q)}
      <div class="opts" role="group">
        ${q.options.map((o, i) => `
          <button class="opt${answers[q.id + "_i"] === i ? " sel" : ""}" id="opt-${q.id}-${i}" data-i="${i}">
            <strong>${esc(o.t)}</strong>${o.s ? `<small>${esc(o.s)}</small>` : ""}
          </button>`).join("")}
      </div>${nav(total)}</section>`;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i;
    if ((q.id === "injury" || q.id === "type") && answers[q.id] !== q.options[i].v) {
      ["type", "type_i", "weeks", "weeks_i"].filter(k => k !== q.id && k !== q.id + "_i").forEach(k => delete answers[k]);
    }
    answers[q.id] = q.options[i].v;
    answers[q.id + "_i"] = i;
    b.classList.add("sel");
    setTimeout(next, 160);
  }));
  bindBack();
}

// Pantalla numérica: "sym" compara pierna sana y lesionada; "score" es una puntuación de 0 a 100
function renderNumber(q, total) {
  const prev = answers[q.id + "_raw"] || {};
  const field = (key, label, ph) => `<label for="${q.id}-${key}">${label}<input id="${q.id}-${key}" type="number" inputmode="decimal" min="0" placeholder="${ph}" value="${prev[key] ?? ""}"></label>`;
  app.innerHTML = `<section class="step">${head(q)}
      <div class="sym${q.kind === "score" ? " one" : ""}">
        ${q.kind === "sym"
          ? field("sana", `Pierna sana <small>(${q.unit})</small>`, "Ej: 40") + field("les", `Pierna lesionada <small>(${q.unit})</small>`, "Ej: 30")
          : field("score", "Puntuación IKDC <small>(0–100)</small>", "Ej: 70")}
      </div>
      <p class="symout" id="${q.id}-out"></p>
      <div class="cta">
        <button class="btn primary" id="${q.id}-go" disabled>Siguiente</button>
        <button class="btn ghost" id="${q.id}-skip">No lo he medido</button>
      </div>${nav(total)}</section>`;
  const inputs = [...app.querySelectorAll(".sym input")];
  const out = document.getElementById(q.id + "-out"), go = document.getElementById(q.id + "-go");
  const read = () => {
    const raw = Object.fromEntries(inputs.map(i => [i.id.slice(q.id.length + 1), i.value]));
    if (inputs.some(i => i.value === "")) return { raw };
    const value = q.kind === "sym" ? (+raw.les / +raw.sana) * 100 : +raw.score;
    if (!isFinite(value) || +raw.sana === 0 || value < 0) return { raw };
    return { raw, value, pass: value > q.min };
  };
  const update = () => {
    const r = read();
    go.disabled = r.value == null;
    if (r.value == null) { out.textContent = q.kind === "sym" ? "Escribe las dos cifras." : "Escribe tu puntuación."; out.className = "symout"; return; }
    const shown = Math.round(r.value);
    out.textContent = (q.kind === "sym" ? `Tu LSI es del ${shown}%. ` : `Tu IKDC es ${shown}. `)
      + (r.pass ? `Cumples (>${q.min}${q.kind === "sym" ? "%" : ""}).` : `Necesitas más de ${q.min}${q.kind === "sym" ? "%" : ""}.`);
    out.className = "symout " + (r.pass ? "pass" : "fail");
  };
  inputs.forEach(i => i.addEventListener("input", update)); update();
  go.addEventListener("click", () => {
    const r = read();
    answers[q.id + "_raw"] = r.raw; answers[q.id + "_val"] = Math.round(r.value); answers[q.id] = r.pass;
    next();
  });
  document.getElementById(q.id + "-skip").addEventListener("click", () => {
    delete answers[q.id + "_raw"]; answers[q.id + "_val"] = null; answers[q.id] = false; next();
  });
  bindBack();
}

function assess(a) {
  const list = criteriaFor(a);
  const met = list.filter(c => a[c.id]).length;
  const pending = list.find(c => !a[c.id]);
  const tooEarly = !!typeOf(a)?.weeks && a.weeks === false;
  return { list, met, pending, tooEarly, ready: !pending && !tooEarly };
}

function detail(c) {
  const ok = answers[c.id] ? "Conseguido" : "Pendiente";
  if (!c.kind) return ok;
  const v = answers[c.id + "_val"];
  return v == null ? "Sin medir" : `${c.kind === "sym" ? v + "%" : v} · ${ok}`;
}

function renderResult() {
  const { list, met, pending, tooEarly, ready } = assess(answers);
  let goal = "";
  if (pending) {
    const unmeasured = pending.kind && answers[pending.id + "_val"] == null;
    goal = `<div class="goal"><span class="label">Tu siguiente objetivo</span><b>${esc(pending.label)}</b>
      <p>${esc(unmeasured ? "Todavía no lo has medido. Pídeselo a tu fisio para saber dónde estás." : pending.work)}</p></div>`;
  }

  app.innerHTML = `
    <section class="result">
      <div class="big">
        <span class="label">${ready ? "Criterios cumplidos" : "Todavía no"}</span>
        <span class="phase">${ready ? "Puedes empezar a correr" : "Todavía no toca correr"}</span>
        <div class="meter" aria-hidden="true">${list.map(c => `<i class="${answers[c.id] ? "ok" : ""}"></i>`).join("")}</div>
        <span class="date">Cumples ${met} de ${list.length} criterios</span>
      </div>

      ${tooEarly ? `<p class="note">Con tu operación se empieza a correr a partir de la semana ${typeOf(answers).weeks}. Mientras tanto, sigue trabajando estos criterios para llegar con todo listo.</p>` : ""}
      ${ready ? `<p class="note">Cumples todos los criterios. Empieza a correr poco a poco y, si a la mañana siguiente la rodilla no duele más ni está más hinchada, vas subiendo.</p>` : goal}

      <h2>Criterios para volver a correr</h2>
      <ol class="steps checks">
        ${list.map(c => `<li class="${answers[c.id] ? "ok" : "ko"}">
          <span class="n">${answers[c.id] ? "✓" : "✗"}</span>
          <div><b>${esc(c.label)}</b><p>${esc(detail(c))}</p></div></li>`).join("")}
      </ol>
      <p class="note">${esc(INJURIES[answers.injury].note)}</p>

      <div class="alert"><b>Para y consulta</b> si la rodilla se hincha, se te bloquea, notas que "se te va" o te duele más cada día.</div>

      <div class="cta">
        <a class="btn primary" href="https://ig.me/m/carloscristobalfisio" target="_blank" rel="noopener">Hablemos de tu recuperación →</a>
        <a class="btn ghost" href="https://carloscristobalfisioterapia.com" target="_blank" rel="noopener">Valoración gratuita online</a>
        <button class="btn ghost" id="restart">Volver a hacer el test</button>
      </div>
      <p class="fine">Esto es una orientación, no un diagnóstico. Cada rodilla es distinta: para un plan hecho para ti, escríbeme por Instagram a @carloscristobalfisio.</p>
    </section>`;
  document.getElementById("restart").addEventListener("click", () => {
    Object.keys(answers).forEach(k => delete answers[k]); step = 0; render();
  });
}

function render() {
  const qs = questions(answers);
  paintProgress(qs.length);
  if (step >= qs.length) renderResult();
  else (qs[step].kind ? renderNumber : renderChoice)(qs[step], qs.length);
  window.scrollTo({ top: 0 });
}
render();
</script>
